<div class="container my-4">

  <h2 class="text-center mb-4">Liste des suggestions</h2>

  <a routerLink="add" class="btn btn-success mb-4">
    ➕ Ajouter suggestion
  </a>

  
  <input
    type="text"
    class="form-control mb-4"
    placeholder="Rechercher une suggestion"
    [(ngModel)]="searchText"
  />

  
  <div
    class="card mb-4 shadow-sm"
    *ngFor="let s of filteredSuggestions()"
  >
    <div class="card-body">

      <h5 class="card-title fw-bold">{{ s.title }}</h5>

      <p class="text-muted mb-2">
        <span class="text-primary fw-semibold">{{ s.category }}</span>
        · {{ s.date | date:'dd MMM yyyy' }}
      </p>

      <p class="card-text">
        {{ s.description }}
      </p>

      
      <span
        *ngIf="s.status === 'acceptee'"
        class="badge bg-success mb-3"
      >
        ACCEPTÉE
      </span>

      <span
        *ngIf="s.status === 'refusee'"
        class="badge bg-danger mb-3"
      >
        REFUSÉE
      </span>

      <span
        *ngIf="s.status === 'en_attente'"
        class="badge bg-warning text-dark mb-3"
      >
        EN ATTENTE
      </span>

      
      <div class="mt-3" *ngIf="s.status !== 'refusee'">

        <button
          class="btn btn-primary me-2"
          (click)="likeSuggestion(s)"
        >
          👍 Like {{ s.nbLikes }}
        </button>

        <button
          class="btn btn-outline-secondary"
          (click)="addToFavorites(s)"
        >
          🤍 Ajouter aux favoris
        </button>
        
        <a
          class="btn btn-outline-primary"
          [routerLink]="[s.id]"
        >
          🔍 Details
        </a>

      </div>

    </div>
  </div>
</div>
